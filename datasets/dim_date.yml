unique_name: dim_date
object_type: dataset
label: dim_date
description: Calendar day (2024-01-01..2026-12-31). Conformed date for claims (service date) and eligibility (member month);
  role-played as Adjudicated date.
connection_id: Connection - Claims Cost Trend
table: dim_date
columns:
- name: date_key
  data_type: long
- name: full_date
  data_type: date
- name: year
  data_type: long
- name: quarter
  data_type: long
- name: quarter_label
  data_type: string
- name: month
  data_type: long
- name: month_name
  data_type: string
- name: year_month
  data_type: string
- name: month_start_key
  data_type: long
- name: iso_week
  data_type: long
- name: day_of_week
  data_type: string
- name: is_weekend
  data_type: boolean
- name: is_complete_month
  data_type: boolean
- name: prior_year
  data_type: long
  sql: year - 1
- name: year_name
  data_type: string
  sql: cast(year as string)
- name: month_label
  data_type: string
  sql: concat(substr(month_name, 1, 3), ' ', cast(year as string))
- name: day_label
  data_type: string
  sql: cast(full_date as string)
- name: month_completeness
  data_type: string
  sql: case when is_complete_month then 'Complete month' else 'Open month' end
