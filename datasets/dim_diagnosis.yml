unique_name: dim_diagnosis
object_type: dataset
label: dim_diagnosis
description: ICD-10-CM diagnosis codes with clinical category.
connection_id: Connection - Claims Cost Trend
table: dim_diagnosis
columns:
- name: diagnosis_id
  data_type: long
- name: icd10_code
  data_type: string
- name: diagnosis_description
  data_type: string
- name: diagnosis_category
  data_type: string
- name: icd10_chapter_letter
  data_type: string
- name: is_chronic_category
  data_type: boolean
- name: diagnosis_label
  data_type: string
  sql: concat(icd10_code, ' - ', diagnosis_description)
- name: chronic_flag
  data_type: string
  sql: case when is_chronic_category then 'Chronic category' else 'Non-chronic category' end
