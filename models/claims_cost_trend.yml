unique_name: claims_cost_trend
object_type: model
label: Medical Claims Cost Trend
description: 'Medical cost trend for a multi-state health plan: PMPM, utilization per 1,000, unit cost and MLR by line of
  business, state, service category, provider, diagnosis, DRG and member, with drill-down to individual claims and claim lines.'
visible: true
