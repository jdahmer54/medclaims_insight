unique_name: Claim Dimension
object_type: dimension
label: Claim Dimension
description: 'Individual claim and its service lines: drill from the claim number (claim header) to each claim line, with
  claim status, denial reason, network status, place of service, claim form and line status.'
type: standard
hierarchies:
- unique_name: Claim Hierarchy
  label: Claim Hierarchy
  folder: Claim
  description: Claim > Claim Line.
  levels:
  - unique_name: Claim
    secondary_attributes:
    - unique_name: Claim Status
      label: Claim Status
      description: Paid or Denied.
      dataset: fact_claim_header
      folder: Claim
      key_columns:
      - claim_status
      name_column: claim_status
      sort_column: claim_status
    - unique_name: Denial Reason
      label: Denial Reason
      description: Reason a claim was denied.
      dataset: fact_claim_header
      folder: Claim
      key_columns:
      - denial_reason
      name_column: denial_reason
      sort_column: denial_reason
    - unique_name: Claim Network Status
      label: Claim Network Status
      description: In- or out-of-network claim.
      dataset: fact_claim_header
      folder: Claim
      key_columns:
      - network_status
      name_column: network_status
      sort_column: network_status
    - unique_name: Place of Service
      label: Place of Service
      description: CMS place of service.
      dataset: fact_claim_header
      folder: Claim
      key_columns:
      - place_of_service
      name_column: place_of_service
      sort_column: place_of_service
    - unique_name: Claim Form
      label: Claim Form
      description: UB-04 (institutional) or CMS-1500 (professional).
      dataset: fact_claim_header
      folder: Claim
      key_columns:
      - claim_form
      name_column: claim_form
      sort_column: claim_form
  - unique_name: Claim Line
    secondary_attributes:
    - unique_name: Line Number
      label: Line Number
      description: Line number within the claim.
      dataset: fact_claim_line
      folder: Claim
      key_columns:
      - line_number
      name_column: line_number
      sort_column: line_number
    - unique_name: Line Status
      label: Line Status
      description: Paid or Denied line.
      dataset: fact_claim_line
      folder: Claim
      key_columns:
      - line_status
      name_column: line_status
      sort_column: line_status
    - unique_name: Line Procedure Code
      label: Line Procedure Code
      description: CPT / HCPCS / revenue code billed on the line.
      dataset: fact_claim_line
      folder: Claim
      key_columns:
      - line_procedure_code
      name_column: line_procedure_code
      sort_column: line_procedure_code
level_attributes:
- unique_name: Claim
  label: Claim
  description: Claim number.
  dataset: fact_claim_header
  is_unique_key: true
  key_columns:
  - claim_id
  name_column: claim_number
  sort_column: claim_number
- unique_name: Claim Line
  label: Claim Line
  description: 'Claim line: line number, procedure code and description.'
  dataset: fact_claim_line
  is_unique_key: true
  key_columns:
  - claim_line_id
  name_column: line_label
  sort_column: claim_line_id
relationships:
- from:
    dataset: fact_claim_line
    join_columns:
    - claim_id
  to:
    level: Claim
  type: snowflake
