unique_name: Paid Amount Year to Date
object_type: metric_calc
label: Paid Amount Year to Date
description: Paid Amount year to date.
expression: CASE WHEN ISEMPTY([Measures].[Paid Amount]) THEN NULL ELSE Aggregate(PeriodsToDate([Date Dimension].[Date Hierarchy].[Year],
  [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Paid Amount]) END
format: "$#,##0"
